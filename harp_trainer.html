<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Harp Trainer">
  <title>Harp Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=JetBrains+Mono:wght@400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: #f8f6f1;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      padding-top: env(safe-area-inset-top, 1.5rem);
      padding-bottom: env(safe-area-inset-bottom, 1.5rem);
      color: #2a2a2a;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
      color: #4a4a4a;
      text-align: center;
    }

    .score-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .toggle-divider {
      width: 1px;
      height: 24px;
      background: #ccc;
      margin: 0 0.15rem;
    }

    .mode-btn {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 0.85rem;
      padding: 0.35rem 0.9rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      color: #333;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }

    .mode-btn:active {
      transform: scale(0.97);
    }

    .mode-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .staff-container {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1rem;
      width: 100%;
      max-width: 500px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .staff-container.live-mode {
      padding: 0;
      overflow: hidden;
    }

    #notation {
      display: block;
      min-width: 200px;
    }

    #notation svg {
      max-width: 100%;
      height: auto;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 100%;
      max-width: 500px;
      padding: 0 0.5rem;
    }

    .answer-btn {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1rem;
      padding: 1rem 0.5rem;
      min-height: 54px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #333;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .answer-btn:active {
      transform: scale(0.97);
      background: #f0f0f0;
    }

    .answer-btn.selected {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1e40af;
    }

    .answer-btn.correct {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .answer-btn.incorrect {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    .answer-btn.missed {
      background: #d4edda;
      border-color: #28a745;
      border-style: dashed;
      color: #155724;
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-btn:disabled:active {
      transform: none;
    }

    .submit-btn {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1rem;
      padding: 0.7rem 2rem;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
      max-width: 500px;
      margin-top: 0.5rem;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .submit-btn:active {
      transform: scale(0.97);
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #a0a0a0;
      cursor: default;
    }

    .submit-btn:disabled:active {
      transform: none;
    }

    .controls {
      margin-top: 0.5rem;
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 500px;
      padding: 0 0.5rem;
    }

    .next-btn {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1rem;
      padding: 0.7rem 2rem;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      background: #4a4a4a;
      color: white;
      cursor: pointer;
      transition: all 0.15s ease;
      flex: 1;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .next-btn:active {
      transform: scale(0.97);
      background: #333;
    }

    .feedback {
      font-size: 1rem;
      margin-top: 0.4rem;
      color: #666;
      text-align: center;
      max-width: 500px;
      padding: 0 0.5rem;
    }

    .feedback:empty {
      display: none;
    }

    .feedback-details {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.25rem;
      text-align: center;
      max-width: 500px;
      padding: 0 0.5rem;
      line-height: 1.6;
    }

    .feedback-details:empty {
      display: none;
    }

    .feedback-details .valid-chord {
      display: inline;
    }

    .feedback-details .valid-chord + .valid-chord::before {
      content: ' \00b7 ';
      color: #bbb;
    }

    .feedback-details .chord-root {
      color: #2563eb;
      font-weight: 600;
    }

    .note-names {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.25rem;
      text-align: center;
    }

    .note-names:empty {
      display: none;
    }

    /* Sight reading */
    #sr-canvas {
      display: none;
      width: 100%;
      height: 400px;
    }

    #sr-setup-overlay, #sr-results-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: rgba(248,246,241,0.97);
      z-index: 10;
      border-radius: 12px;
      padding: 1rem;
    }

    #sr-setup-overlay h1, #sr-results-overlay h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #4a4a4a;
    }

    .sr-option-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      color: #4a4a4a;
      letter-spacing: 0.05em;
      margin-top: 0.3rem;
    }

    .sr-option-row {
      display: flex;
      gap: 0.4rem;
    }

    .sr-result-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3rem;
      font-weight: 700;
      color: #2a2a2a;
    }

    .sr-result-label {
      font-size: 0.9rem;
      color: #888;
      margin-top: -0.3rem;
    }

    .sr-result-detail {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #888;
    }

    .sr-result-level {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #2563eb;
    }

    #sr-start-btn {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.1rem;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    #sr-start-btn:hover { background: #1d4ed8; }
    #sr-start-btn:active { transform: scale(0.97); }

    /* Larger phones / landscape */
    @media (min-width: 400px) {
      .answer-btn {
        font-size: 1.05rem;
        padding: 1.1rem 0.75rem;
      }
    }

    /* Small phones */
    @media (max-width: 350px) {
      .answer-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .answer-btn {
        font-size: 0.9rem;
        padding: 0.9rem 0.4rem;
      }
    }

    /* Pedal diagram */
    .pedal-diagram {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
    }

    .pedal-group {
      display: flex;
      gap: 0.5rem;
    }

    .pedal-divider {
      width: 2px;
      height: 60px;
      background: #ccc;
      margin: 0 0.25rem;
    }

    .pedal {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 36px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .pedal:active {
      transform: scale(0.95);
    }

    .pedal.locked {
      cursor: default;
      opacity: 0.5;
    }

    .pedal.locked:active {
      transform: none;
    }

    .pedal-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }

    .pedal-track {
      width: 24px;
      height: 48px;
      background: #e8e8e8;
      border-radius: 12px;
      position: relative;
      border: 1px solid #ccc;
    }

    .pedal-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #666;
      transition: top 0.15s ease, background 0.15s ease;
    }

    .pedal.flat .pedal-dot {
      top: 2px;
      background: #2563eb;
    }

    .pedal.flat .pedal-name {
      color: #2563eb;
    }

    .pedal.natural .pedal-dot {
      top: 16px;
      background: #666;
    }

    .pedal.sharp .pedal-dot {
      top: 30px;
      background: #dc2626;
    }

    .pedal.sharp .pedal-name {
      color: #dc2626;
    }

    .pedal-labels {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #999;
    }

    /* Key signature incrementor */
    .key-sig-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eee;
    }

    .key-sig-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 600;
      width: 48px;
      height: 48px;
      border: 2px solid #ccc;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }

    .key-sig-btn:active {
      transform: scale(0.93);
      background: #f0f0f0;
    }

    .key-sig-btn.flat-btn {
      color: #2563eb;
      border-color: #93b4f0;
    }

    .key-sig-btn.sharp-btn {
      color: #dc2626;
      border-color: #f0a0a0;
    }

    .key-sig-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .key-sig-btn:disabled:active {
      transform: none;
      background: white;
    }

    .key-sig-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: #444;
      min-width: 120px;
      text-align: center;
      line-height: 1.3;
    }

    .key-sig-label .key-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .key-sig-label .sig-detail {
      font-size: 0.7rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="score-display" id="score-display">Score: <span id="score">0</span> / <span id="total">0</span></div>

  <div class="toggle-row">
    <button class="mode-btn active" id="app-chordId" onclick="setAppMode('chordId')">Chord ID</button>
    <button class="mode-btn" id="app-interval" onclick="setAppMode('interval')">Interval&#x2192;Chord</button>
    <button class="mode-btn" id="app-sightread" onclick="setAppMode('sightread')">Sight Read</button>
    <div class="toggle-divider" id="note-count-divider" style="display:none"></div>
    <button class="mode-btn active" id="mode-2" onclick="setNoteMode(2)" style="display:none">2 Notes</button>
    <button class="mode-btn" id="mode-3" onclick="setNoteMode(3)" style="display:none">3 Notes</button>
  </div>

  <div class="staff-container" id="staff-container">
    <div id="notation"></div>
    <canvas id="sr-canvas"></canvas>

    <div id="sr-setup-overlay">
      <h1>SIGHT READING</h1>
      <div class="sr-option-label">SESSION LENGTH</div>
      <div class="sr-option-row" id="sr-duration-row">
        <button class="mode-btn active" onclick="srSetDuration(60)">1 min</button>
        <button class="mode-btn" onclick="srSetDuration(120)">2 min</button>
        <button class="mode-btn" onclick="srSetDuration(300)">5 min</button>
      </div>
      <div class="sr-option-label">FINGERS PER POSITION</div>
      <div class="sr-option-row" id="sr-fingers-row">
        <button class="mode-btn" onclick="srSetFingers(3)">3</button>
        <button class="mode-btn active" onclick="srSetFingers(4)">4</button>
      </div>
      <div class="sr-option-label">STARTING SPEED</div>
      <div class="sr-option-row" id="sr-speed-row">
        <button class="mode-btn active" onclick="srSetSpeed('relaxed')">Relaxed</button>
        <button class="mode-btn" onclick="srSetSpeed('moderate')">Moderate</button>
        <button class="mode-btn" onclick="srSetSpeed('brisk')">Brisk</button>
      </div>
      <div class="sr-option-label">INPUT</div>
      <div class="sr-option-row" id="sr-input-row">
        <button class="mode-btn active" onclick="srSetInput('manual')">Manual (Space)</button>
        <button class="mode-btn" onclick="srSetInput('mic')">Microphone</button>
      </div>
      <button id="sr-start-btn" onclick="startSightRead()">Start</button>
    </div>

    <div id="sr-results-overlay">
      <h1>SESSION COMPLETE</h1>
      <div class="sr-result-big" id="sr-result-npm">0</div>
      <div class="sr-result-label">notes per minute</div>
      <div class="sr-result-detail" id="sr-result-positions"></div>
      <div class="sr-result-detail" id="sr-result-accuracy"></div>
      <div class="sr-result-detail" id="sr-result-pace"></div>
      <div class="sr-result-detail" id="sr-result-range"></div>
      <div class="sr-result-level" id="sr-result-level"></div>
      <div class="sr-option-row" style="margin-top:0.5rem">
        <button class="mode-btn" onclick="startSightRead()">Try Again</button>
        <button class="mode-btn" onclick="showSrSetup()">New Drill</button>
      </div>
    </div>

    <div class="pedal-diagram" id="pedal-diagram">
      <div class="pedal-group left">
        <div class="pedal natural" id="pedal-D" onclick="cyclePedal('D')"><span class="pedal-name">D</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
        <div class="pedal natural" id="pedal-C" onclick="cyclePedal('C')"><span class="pedal-name">C</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
        <div class="pedal natural" id="pedal-B" onclick="cyclePedal('B')"><span class="pedal-name">B</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
      </div>
      <div class="pedal-divider"></div>
      <div class="pedal-group right">
        <div class="pedal natural" id="pedal-E" onclick="cyclePedal('E')"><span class="pedal-name">E</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
        <div class="pedal natural" id="pedal-F" onclick="cyclePedal('F')"><span class="pedal-name">F</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
        <div class="pedal natural" id="pedal-G" onclick="cyclePedal('G')"><span class="pedal-name">G</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
        <div class="pedal natural" id="pedal-A" onclick="cyclePedal('A')"><span class="pedal-name">A</span><div class="pedal-track"><div class="pedal-dot"></div></div></div>
      </div>
    </div>
    <div class="pedal-labels" id="pedal-labels">
      <span>&#x2191; flat</span>
      <span>&#x2014; natural</span>
      <span>&#x2193; sharp</span>
    </div>
    <div class="key-sig-control" id="key-sig-control">
      <button class="key-sig-btn flat-btn" id="flat-btn" onclick="addFlat()">&#x266d;+</button>
      <div class="key-sig-label">
        <div class="key-name" id="key-name">C major</div>
        <div class="sig-detail" id="sig-detail">no sharps/flats</div>
      </div>
      <button class="key-sig-btn sharp-btn" id="sharp-btn" onclick="addSharp()">&#x266f;+</button>
    </div>
  </div>

  <div class="answer-grid" id="answers"></div>
  <button class="submit-btn" id="submit-btn" onclick="submitAnswer()" style="display:none" disabled>SUBMIT</button>
  <div class="feedback" id="feedback"></div>
  <div class="feedback-details" id="feedback-details"></div>
  <div class="note-names" id="note-names"></div>

  <div class="controls" id="controls">
    <button class="next-btn" id="next-btn" onclick="handleNext()">Next Chord</button>
  </div>

  <script>
    // ══════════════════════════════════════════
    //  1. VEXFLOW IMPORTS
    // ══════════════════════════════════════════
    const { Renderer, Stave, StaveNote, Voice, Formatter, Beam, Accidental } = Vex.Flow;

    // ══════════════════════════════════════════
    //  2. CONFIG CONSTANTS
    // ══════════════════════════════════════════
    const FFT_SIZE = 8192;
    const NOISE_GATE = 0.008;
    const CLARITY_THRESH = 0.93;
    const STEP = 9;
    const LINE_SPACING = STEP * 2;
    const NOTE_RX = STEP * 1.1;
    const NOTE_RY = STEP * 0.85;

    // ══════════════════════════════════════════
    //  2b. WASM POLYPHONIC PITCH DETECTOR
    // ══════════════════════════════════════════
    let wasmDetector = null;
    async function initWasmDetector() {
      const wasm = await import('./harp-pitch-wasm/pkg/harp_pitch_wasm.js');
      await wasm.default();
      wasmDetector = new wasm.HarpPitchDetector(FFT_SIZE, 44100);
    }
    initWasmDetector().catch(e => console.warn('WASM polyphonic detector unavailable, using JS fallback:', e));

    // ══════════════════════════════════════════
    //  3. MUSIC CONSTANTS
    // ══════════════════════════════════════════
    const noteLetters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

    const chordTypes = [
      { name: 'Major Triad', short: 'Maj', intervals: [0, 4, 7], minNotes: 3, required: [0, 4, 7] },
      { name: 'Minor Triad', short: 'm', intervals: [0, 3, 7], minNotes: 3, required: [0, 3, 7] },
      { name: 'Diminished Triad', short: 'dim', intervals: [0, 3, 6], minNotes: 3, required: [0, 3, 6] },
      { name: 'Major 7th', short: 'maj7', intervals: [0, 4, 7, 11], minNotes: 4, required: [0, 4, 7, 11] },
      { name: 'Minor 7th', short: 'm7', intervals: [0, 3, 7, 10], minNotes: 4, required: [0, 3, 7, 10] },
      { name: 'Dominant 7th', short: '7', intervals: [0, 4, 7, 10], minNotes: 4, required: [0, 4, 7, 10] },
      { name: 'Half-dim 7th', short: '\u00f87', intervals: [0, 3, 6, 10], minNotes: 4, required: [0, 3, 6, 10] },
      { name: 'Sus2', short: 'sus2', intervals: [0, 2, 7], minNotes: 3, required: [0, 2, 7] },
      { name: 'Sus4', short: 'sus4', intervals: [0, 5, 7], minNotes: 3, required: [0, 5, 7] },
    ];

    const unambiguousChordTypes = chordTypes.filter(type => {
      const semitones = type.intervals;
      for (const ct of chordTypes) {
        if (ct === type || ct.intervals.length !== semitones.length) continue;
        for (const rootST of semitones) {
          const ivs = semitones.map(s => (s - rootST + 12) % 12).sort((a, b) => a - b);
          const ctIvs = [...ct.intervals].sort((a, b) => a - b);
          if (ivs.every((v, i) => v === ctIvs[i])) return false;
        }
      }
      return true;
    });

    const chordIdAnswerOptions = unambiguousChordTypes.map(c => c.name);
    const intervalAnswerOptions = chordTypes.map(c => c.short);

    const DIATONIC = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];
    const IS_SHARP = [false, true, false, true, false, false, true, false, true, false, true, false];
    const NOTE_NAMES = ['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];
    const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
    const SOLFEGE = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Ti'];

    const TREBLE_LINES = [30, 32, 34, 36, 38];
    const BASS_LINES = [18, 20, 22, 24, 26];

    // Key signature data
    const sharpOrder = ['F', 'C', 'G', 'D', 'A', 'E', 'B'];
    const flatOrder  = ['B', 'E', 'A', 'D', 'G', 'C', 'F'];
    const sharpKeys = ['C major', 'G major', 'D major', 'A major', 'E major', 'B major', 'F\u266f major', 'C\u266f major'];
    const flatKeys  = ['C major', 'F major', 'B\u266d major', 'E\u266d major', 'A\u266d major', 'D\u266d major', 'G\u266d major', 'C\u266d major'];

    // ══════════════════════════════════════════
    //  4. SHAPE NOTE SYSTEM
    // ══════════════════════════════════════════
    function getScaleDegree(midi, root) {
      const interval = ((midi % 12) - root + 12) % 12;
      const idx = MAJOR_SCALE.indexOf(interval);
      return idx >= 0 ? idx + 1 : 0;
    }

    function shapePath(c, x, y, rx, ry, degree) {
      switch (degree) {
        case 1:
          c.moveTo(x, y - ry);
          c.lineTo(x + rx, y + ry);
          c.lineTo(x - rx, y + ry);
          c.closePath();
          break;
        case 2:
          c.ellipse(x, y, rx, ry, 0, -Math.PI / 2, Math.PI / 2);
          c.closePath();
          break;
        case 3:
          c.moveTo(x, y - ry);
          c.lineTo(x + rx, y);
          c.lineTo(x, y + ry);
          c.lineTo(x - rx, y);
          c.closePath();
          break;
        case 4:
          c.moveTo(x - rx, y - ry);
          c.lineTo(x + rx, y + ry);
          c.lineTo(x - rx, y + ry);
          c.closePath();
          break;
        case 5:
          c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          break;
        case 6:
          c.rect(x - rx, y - ry, rx * 2, ry * 2);
          break;
        case 7:
          c.moveTo(x, y + ry);
          c.lineTo(x + rx, y - ry);
          c.lineTo(x - rx, y - ry);
          c.closePath();
          break;
        default:
          c.ellipse(x, y, rx * 0.5, ry * 0.5, 0, 0, Math.PI * 2);
          break;
      }
    }

    // ══════════════════════════════════════════
    //  5. SHARED STATE
    // ══════════════════════════════════════════
    let appMode = 'chordId'; // 'chordId', 'interval', 'sightread'
    let pedalState = {
      D: 'natural', C: 'natural', B: 'natural',
      E: 'natural', F: 'natural', G: 'natural', A: 'natural'
    };
    let score = 0;
    let total = 0;

    // ══════════════════════════════════════════
    //  6. DRILL STATE
    // ══════════════════════════════════════════
    let currentChord = null;
    let chordIdAnswered = false;

    const IDLE = 'IDLE';
    const SELECTING = 'SELECTING';
    const ANSWERED = 'ANSWERED';
    let gameState = IDLE;
    let noteMode = 2;
    let currentPuzzle = null;
    let selectedTypes = new Set();

    // ══════════════════════════════════════════
    //  7. AUDIO STATE (shared with Sight Read)
    // ══════════════════════════════════════════
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;

    // ══════════════════════════════════════════
    //  8. SHARED HELPERS
    // ══════════════════════════════════════════
    function getNoteSemitone(letter) {
      const baseSemitones = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      let semitone = baseSemitones[letter];
      const pedal = pedalState[letter];
      if (pedal === 'flat') semitone -= 1;
      if (pedal === 'sharp') semitone += 1;
      return (semitone + 12) % 12;
    }

    function getAccidentalForNote(noteLetter) {
      const letter = noteLetter.toUpperCase();
      const position = pedalState[letter];
      if (position === 'flat') return 'b';
      if (position === 'sharp') return '#';
      return '';
    }

    function getAvailableScale() {
      return noteLetters.map(letter => ({
        letter,
        semitone: getNoteSemitone(letter),
        accidental: getAccidentalForNote(letter)
      }));
    }

    function midiToVexFlow(midi, letter) {
      const octave = Math.floor(midi / 12) - 1;
      const acc = getAccidentalForNote(letter);
      return `${letter.toLowerCase()}${acc}/${octave}`;
    }

    function midiToNoteName(midi, letter) {
      const octave = Math.floor(midi / 12) - 1;
      const acc = getAccidentalForNote(letter);
      const accSymbol = acc === '#' ? '\u266f' : acc === 'b' ? '\u266d' : '';
      return `${letter}${accSymbol}${octave}`;
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getVexKeySig() {
      const { sharps, flats, isStandard } = getKeySigPosition();
      let keySig = 'C';
      if (isStandard) {
        if (sharps > 0) keySig = sharpKeys[sharps].replace(' major', '').replace('\u266f', '#');
        if (flats > 0) keySig = flatKeys[flats].replace(' major', '').replace('\u266d', 'b');
      }
      return { keySig, isStandard };
    }

    function getKeyRootFromPedals() {
      const { sharps, flats, isStandard } = getKeySigPosition();
      if (!isStandard) return 0;
      const sharpRoots = [0, 7, 2, 9, 4, 11, 6, 1];
      const flatRoots  = [0, 5, 10, 3, 8, 1, 6, 11];
      if (sharps > 0) return sharpRoots[sharps];
      if (flats > 0) return flatRoots[flats];
      return 0;
    }

    // Staff helpers
    function midiToStaffPos(midi) {
      return (Math.floor(midi / 12) - 1) * 7 + DIATONIC[midi % 12];
    }

    function freqToMidi(freq) {
      return Math.round(69 + 12 * Math.log2(freq / 440));
    }

    // ══════════════════════════════════════════
    //  9. PEDAL / KEY FUNCTIONS
    // ══════════════════════════════════════════
    function cyclePedal(note) {
      if (appMode === 'interval' && gameState === SELECTING) return;
      const positions = ['flat', 'natural', 'sharp'];
      const currentIdx = positions.indexOf(pedalState[note]);
      pedalState[note] = positions[(currentIdx + 1) % 3];
      updatePedalDisplay();
      updateKeyLabel();
      if (appMode === 'chordId' && currentChord) renderChord(currentChord);
    }

    function updatePedalDisplay() {
      const locked = appMode === 'interval' && gameState === SELECTING;
      for (const [note, position] of Object.entries(pedalState)) {
        const pedalEl = document.getElementById(`pedal-${note}`);
        pedalEl.className = `pedal ${position}${locked ? ' locked' : ''}`;
      }
    }

    function getKeySigPosition() {
      let sharps = 0;
      let flats = 0;
      for (const note of sharpOrder) {
        if (pedalState[note] === 'sharp') sharps++;
        if (pedalState[note] === 'flat') flats++;
      }
      let isStandard = true;
      if (sharps > 0 && flats > 0) isStandard = false;
      if (sharps > 0) {
        for (let i = 0; i < sharps; i++) {
          if (pedalState[sharpOrder[i]] !== 'sharp') isStandard = false;
        }
        for (let i = sharps; i < 7; i++) {
          if (pedalState[sharpOrder[i]] !== 'natural') isStandard = false;
        }
      }
      if (flats > 0) {
        for (let i = 0; i < flats; i++) {
          if (pedalState[flatOrder[i]] !== 'flat') isStandard = false;
        }
        for (let i = flats; i < 7; i++) {
          if (pedalState[flatOrder[i]] !== 'natural') isStandard = false;
        }
      }
      return { sharps, flats, isStandard };
    }

    function updateKeyLabel() {
      const { sharps, flats, isStandard } = getKeySigPosition();
      const nameEl = document.getElementById('key-name');
      const detailEl = document.getElementById('sig-detail');

      if (!isStandard) {
        nameEl.textContent = 'Custom';
        const parts = [];
        for (const note of Object.keys(pedalState)) {
          if (pedalState[note] === 'sharp') parts.push(note + '\u266f');
          if (pedalState[note] === 'flat') parts.push(note + '\u266d');
        }
        detailEl.textContent = parts.length ? parts.join(' ') : 'no sharps/flats';
        return;
      }

      if (sharps > 0) {
        nameEl.textContent = sharpKeys[sharps];
        const names = sharpOrder.slice(0, sharps).join(' ');
        detailEl.textContent = `${sharps}\u266f: ${names}`;
      } else if (flats > 0) {
        nameEl.textContent = flatKeys[flats];
        const names = flatOrder.slice(0, flats).join(' ');
        detailEl.textContent = `${flats}\u266d: ${names}`;
      } else {
        nameEl.textContent = 'C major';
        detailEl.textContent = 'no sharps/flats';
      }
    }

    function updateKeySigButtons() {
      const locked = appMode === 'interval' && gameState === SELECTING;
      document.getElementById('flat-btn').disabled = locked;
      document.getElementById('sharp-btn').disabled = locked;
    }

    function addSharp() {
      if (appMode === 'interval' && gameState === SELECTING) return;
      const { sharps, flats } = getKeySigPosition();
      if (flats > 0) {
        pedalState[flatOrder[flats - 1]] = 'natural';
      } else if (sharps < 7) {
        pedalState[sharpOrder[sharps]] = 'sharp';
      }
      updatePedalDisplay();
      updateKeyLabel();
      if (appMode === 'chordId' && currentChord) renderChord(currentChord);
    }

    function addFlat() {
      if (appMode === 'interval' && gameState === SELECTING) return;
      const { sharps, flats } = getKeySigPosition();
      if (sharps > 0) {
        pedalState[sharpOrder[sharps - 1]] = 'natural';
      } else if (flats < 7) {
        pedalState[flatOrder[flats]] = 'flat';
      }
      updatePedalDisplay();
      updateKeyLabel();
      if (appMode === 'chordId' && currentChord) renderChord(currentChord);
    }

    // ══════════════════════════════════════════
    //  10. MODE SWITCHING
    // ══════════════════════════════════════════
    function setAppMode(mode) {
      // Stop sight reading if leaving sightread mode
      if (appMode === 'sightread' && mode !== 'sightread') {
        stopSightRead();
      }

      appMode = mode;

      // Reset score when switching between drill modes
      if (mode === 'chordId' || mode === 'interval') {
        score = 0;
        total = 0;
        document.getElementById('score').textContent = '0';
        document.getElementById('total').textContent = '0';
      }

      // Update toggle buttons
      document.getElementById('app-chordId').className = `mode-btn${mode === 'chordId' ? ' active' : ''}`;
      document.getElementById('app-interval').className = `mode-btn${mode === 'interval' ? ' active' : ''}`;
      document.getElementById('app-sightread').className = `mode-btn${mode === 'sightread' ? ' active' : ''}`;

      const isDrill = mode === 'chordId' || mode === 'interval';
      const isInterval = mode === 'interval';
      const isSR = mode === 'sightread';

      // Score display
      document.getElementById('score-display').style.display = isDrill ? '' : 'none';

      // Note count toggle (interval only)
      document.getElementById('note-count-divider').style.display = isInterval ? '' : 'none';
      document.getElementById('mode-2').style.display = isInterval ? '' : 'none';
      document.getElementById('mode-3').style.display = isInterval ? '' : 'none';

      // Notation / canvas
      document.getElementById('notation').style.display = isSR ? 'none' : 'block';
      document.getElementById('sr-canvas').style.display = isSR ? 'block' : 'none';

      // Staff container live-mode class
      const staffContainer = document.getElementById('staff-container');
      if (isSR) {
        staffContainer.classList.add('live-mode');
      } else {
        staffContainer.classList.remove('live-mode');
      }

      // Sight reading overlays
      document.getElementById('sr-setup-overlay').style.display = isSR && !srRunning ? 'flex' : 'none';
      document.getElementById('sr-results-overlay').style.display = 'none';

      // Pedal diagram + key sig are always visible (inside staff-container)
      // But in sr mode, move them outside live-mode padding
      const pedalDiagram = document.getElementById('pedal-diagram');
      const pedalLabels = document.getElementById('pedal-labels');
      const keySigControl = document.getElementById('key-sig-control');
      if (isSR) {
        pedalDiagram.style.margin = '1rem 1rem 0';
        pedalDiagram.style.paddingTop = '1rem';
        pedalLabels.style.margin = '0.5rem 1rem 0';
        keySigControl.style.margin = '0 1rem 1rem';
        keySigControl.style.paddingTop = '0.75rem';
      } else {
        pedalDiagram.style.margin = '';
        pedalDiagram.style.paddingTop = '';
        pedalLabels.style.margin = '';
        keySigControl.style.margin = '';
        keySigControl.style.paddingTop = '';
      }

      // Answer grid, submit, feedback, controls
      document.getElementById('answers').style.display = isDrill ? '' : 'none';
      document.getElementById('submit-btn').style.display = isInterval ? '' : 'none';
      document.getElementById('feedback').style.display = isDrill ? '' : 'none';
      document.getElementById('feedback-details').style.display = isDrill ? '' : 'none';
      document.getElementById('note-names').style.display = isDrill ? '' : 'none';
      document.getElementById('controls').style.display = isDrill ? 'flex' : 'none';

      // Clear feedback
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback-details').innerHTML = '';
      document.getElementById('note-names').textContent = '';

      // Reset drill states
      gameState = IDLE;
      chordIdAnswered = false;
      currentChord = null;
      currentPuzzle = null;
      selectedTypes.clear();

      // Unlock pedals
      updatePedalDisplay();
      updateKeySigButtons();

      // Initialize mode
      if (mode === 'chordId') {
        document.getElementById('next-btn').textContent = 'Next Chord';
        newChord();
      } else if (mode === 'interval') {
        document.getElementById('next-btn').textContent = 'Next';
        newPuzzle();
      } else if (mode === 'sightread') {
        initSrCanvas();
        if (srRunning) {
          document.getElementById('sr-setup-overlay').style.display = 'none';
        }
      }
    }

    function handleNext() {
      if (appMode === 'chordId') {
        newChord();
      } else if (appMode === 'interval') {
        newPuzzle();
      }
    }

    // ══════════════════════════════════════════
    //  11. CHORD ID DRILL
    // ══════════════════════════════════════════
    function generateChord() {
      const scale = getAvailableScale();
      const chordType = unambiguousChordTypes[Math.floor(Math.random() * unambiguousChordTypes.length)];

      const rootIdx = Math.floor(Math.random() * 7);
      const rootLetter = noteLetters[rootIdx];
      const rootSemitone = scale[rootIdx].semitone;

      const chordNotes = [];
      for (const interval of chordType.intervals) {
        const targetSemitone = (rootSemitone + interval) % 12;
        const match = scale.find(n => n.semitone === targetSemitone);
        if (match) {
          chordNotes.push({ letter: match.letter, interval: interval });
        }
      }

      const hasRequired = chordType.required.every(req =>
        chordNotes.some(n => n.interval === req)
      );

      if (chordNotes.length < chordType.minNotes || !hasRequired) {
        return generateChord();
      }

      const noteSemitones = chordNotes.map(n => scale.find(s => s.letter === n.letter).semitone);
      let chordInterpretations = 0;
      for (const ct of chordTypes) {
        if (ct.intervals.length !== noteSemitones.length) continue;
        for (const rootST of noteSemitones) {
          const ivs = noteSemitones.map(s => (s - rootST + 12) % 12).sort((a, b) => a - b);
          const ctIvs = [...ct.intervals].sort((a, b) => a - b);
          if (ivs.every((v, i) => v === ctIvs[i])) chordInterpretations++;
        }
      }
      if (chordInterpretations > 1) return generateChord();

      const rootOctave = 3;
      let arpeggioNotes = [];

      for (const note of chordNotes) {
        arpeggioNotes.push({
          letter: note.letter,
          midi: (rootOctave + 1) * 12 + scale.find(s => s.letter === note.letter).semitone,
          interval: note.interval
        });
      }

      arpeggioNotes.sort((a, b) => a.midi - b.midi);
      if (Math.random() < 0.5) arpeggioNotes.reverse();

      const vexKeys = arpeggioNotes.map(n => midiToVexFlow(n.midi, n.letter));
      const noteNamesList = arpeggioNotes.map(n => midiToNoteName(n.midi, n.letter));

      return {
        type: chordType.name,
        root: rootLetter + (getAccidentalForNote(rootLetter) === '#' ? '\u266f' : getAccidentalForNote(rootLetter) === 'b' ? '\u266d' : ''),
        keys: vexKeys,
        midis: arpeggioNotes.map(n => n.midi),
        letters: arpeggioNotes.map(n => n.letter),
        noteNames: noteNamesList
      };
    }

    function renderChord(chord) {
      const container = document.getElementById('notation');
      container.innerHTML = '';

      const numNotes = chord.keys.length;
      const width = Math.max(400, numNotes * 45 + 100);

      const renderer = new Renderer(container, Renderer.Backends.SVG);
      renderer.resize(width, 220);
      const context = renderer.getContext();

      const { keySig, isStandard } = getVexKeySig();

      const trebleStave = new Stave(10, 10, width - 20);
      trebleStave.addClef('treble');
      if (isStandard && keySig !== 'C') trebleStave.addKeySignature(keySig);
      trebleStave.setContext(context).draw();

      const bassStave = new Stave(10, 110, width - 20);
      bassStave.addClef('bass');
      if (isStandard && keySig !== 'C') bassStave.addKeySignature(keySig);
      bassStave.setContext(context).draw();

      const trebleNotes = [];
      const bassNotes = [];

      chord.midis.forEach((midi, idx) => {
        const key = chord.keys[idx];
        const letter = chord.letters[idx];
        const octave = parseInt(key.split('/')[1]);
        const acc = getAccidentalForNote(letter);

        if (octave >= 4) {
          const note = new StaveNote({ clef: 'treble', keys: [key], duration: '8' });
          if (acc) note.addModifier(new Accidental(acc), 0);
          trebleNotes.push(note);
          bassNotes.push(new StaveNote({ clef: 'bass', keys: ['d/3'], duration: '8r' }));
        } else {
          const note = new StaveNote({ clef: 'bass', keys: [key], duration: '8' });
          if (acc) note.addModifier(new Accidental(acc), 0);
          bassNotes.push(note);
          trebleNotes.push(new StaveNote({ clef: 'treble', keys: ['b/4'], duration: '8r' }));
        }
      });

      const totalNotes = trebleNotes.length;
      const totalBeats = totalNotes / 2;

      const trebleBeamNotes = trebleNotes.filter(n => n.getNoteType() !== 'r');
      const bassBeamNotes = bassNotes.filter(n => n.getNoteType() !== 'r');

      const beams = [];
      if (trebleBeamNotes.length >= 2) {
        let group = [trebleBeamNotes[0]];
        for (let i = 1; i < trebleBeamNotes.length; i++) {
          const prevIdx = trebleNotes.indexOf(group[group.length - 1]);
          const currIdx = trebleNotes.indexOf(trebleBeamNotes[i]);
          if (currIdx - prevIdx === 1) {
            group.push(trebleBeamNotes[i]);
          } else {
            if (group.length >= 2) beams.push(new Beam(group));
            group = [trebleBeamNotes[i]];
          }
        }
        if (group.length >= 2) beams.push(new Beam(group));
      }

      if (bassBeamNotes.length >= 2) {
        let group = [bassBeamNotes[0]];
        for (let i = 1; i < bassBeamNotes.length; i++) {
          const prevIdx = bassNotes.indexOf(group[group.length - 1]);
          const currIdx = bassNotes.indexOf(bassBeamNotes[i]);
          if (currIdx - prevIdx === 1) {
            group.push(bassBeamNotes[i]);
          } else {
            if (group.length >= 2) beams.push(new Beam(group));
            group = [bassBeamNotes[i]];
          }
        }
        if (group.length >= 2) beams.push(new Beam(group));
      }

      const trebleVoice = new Voice({ num_beats: totalBeats, beat_value: 4 }).setMode(Voice.Mode.SOFT);
      trebleVoice.addTickables(trebleNotes);

      const bassVoice = new Voice({ num_beats: totalBeats, beat_value: 4 }).setMode(Voice.Mode.SOFT);
      bassVoice.addTickables(bassNotes);

      new Formatter().joinVoices([trebleVoice]).joinVoices([bassVoice]).format([trebleVoice, bassVoice], width - 100);

      trebleVoice.draw(context, trebleStave);
      bassVoice.draw(context, bassStave);
      beams.forEach(beam => beam.setContext(context).draw());
    }

    function renderChordIdAnswers() {
      const container = document.getElementById('answers');
      container.innerHTML = '';

      chordIdAnswerOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = option;
        btn.onclick = () => checkChordIdAnswer(option, btn);
        container.appendChild(btn);
      });
    }

    function checkChordIdAnswer(answer, btn) {
      if (chordIdAnswered) return;
      chordIdAnswered = true;
      total++;

      const buttons = document.querySelectorAll('.answer-btn');
      buttons.forEach(b => b.disabled = true);

      if (answer === currentChord.type) {
        score++;
        btn.classList.add('correct');
        document.getElementById('feedback').textContent = `\u2713 ${currentChord.root} ${currentChord.type}`;
      } else {
        btn.classList.add('incorrect');
        buttons.forEach(b => {
          if (b.textContent === currentChord.type) b.classList.add('correct');
        });
        document.getElementById('feedback').textContent = `\u2717 ${currentChord.root} ${currentChord.type}`;
      }

      document.getElementById('score').textContent = score;
      document.getElementById('total').textContent = total;
      document.getElementById('note-names').textContent = currentChord.noteNames.join(' - ');
    }

    function newChord() {
      chordIdAnswered = false;
      currentChord = generateChord();
      renderChord(currentChord);
      renderChordIdAnswers();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').style.color = '#666';
      document.getElementById('feedback-details').innerHTML = '';
      document.getElementById('note-names').textContent = '';
      document.getElementById('controls').style.display = 'flex';
    }

    // ══════════════════════════════════════════
    //  12. INTERVAL DRILL
    // ══════════════════════════════════════════
    function findValidChords(chosenNotes) {
      const semitones = chosenNotes.map(n => n.semitone);
      const results = [];

      for (const chord of chordTypes) {
        for (const potentialRoot of chosenNotes) {
          const intervals = semitones.map(s => (s - potentialRoot.semitone + 12) % 12);
          const allMatch = intervals.every(iv => chord.intervals.includes(iv));
          if (allMatch) {
            const accSymbol = getAccidentalForNote(potentialRoot.letter) === '#' ? '\u266f' : getAccidentalForNote(potentialRoot.letter) === 'b' ? '\u266d' : '';
            results.push({
              typeName: chord.short,
              rootLetter: potentialRoot.letter,
              rootDisplay: potentialRoot.letter + accSymbol,
              rootSemitone: potentialRoot.semitone
            });
          }
        }
      }

      return results;
    }

    function getValidTypeNames(validChords) {
      return [...new Set(validChords.map(c => c.typeName))];
    }

    function getKeySigAccidentals() {
      const { sharps, flats, isStandard } = getKeySigPosition();
      const result = {};
      if (!isStandard) return result;
      if (sharps > 0) {
        for (let i = 0; i < sharps; i++) result[sharpOrder[i]] = '#';
      }
      if (flats > 0) {
        for (let i = 0; i < flats; i++) result[flatOrder[i]] = 'b';
      }
      return result;
    }

    function generatePuzzle() {
      const scale = getAvailableScale();

      const semitoneSet = new Set(scale.map(n => n.semitone));
      if (semitoneSet.size < noteMode) return null;

      for (let attempt = 0; attempt < 50; attempt++) {
        const shuffled = shuffle(scale);
        const chosen = [];
        const usedSemitones = new Set();

        for (const note of shuffled) {
          if (chosen.length >= noteMode) break;
          if (!usedSemitones.has(note.semitone)) {
            chosen.push(note);
            usedSemitones.add(note.semitone);
          }
        }

        if (chosen.length < noteMode) continue;

        const validChords = findValidChords(chosen);
        const validTypeNames = getValidTypeNames(validChords);

        if (validTypeNames.length === 0) continue;
        if (validTypeNames.length > 6) continue;

        const baseSemitones = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        const displayNotes = chosen.map(n => {
          const octave = 3 + Math.floor(Math.random() * 3);
          const midi = (octave + 1) * 12 + baseSemitones[n.letter] + (pedalState[n.letter] === 'sharp' ? 1 : pedalState[n.letter] === 'flat' ? -1 : 0);
          return {
            letter: n.letter,
            semitone: n.semitone,
            midi: midi,
            vexKey: midiToVexFlow(midi, n.letter),
            noteName: midiToNoteName(midi, n.letter)
          };
        });

        displayNotes.sort((a, b) => a.midi - b.midi);

        return {
          notes: displayNotes,
          validChords: validChords,
          validTypeNames: validTypeNames
        };
      }

      return null;
    }

    function renderNotes(puzzle) {
      const container = document.getElementById('notation');
      container.innerHTML = '';

      const width = 280;
      const renderer = new Renderer(container, Renderer.Backends.SVG);
      renderer.resize(width, 220);
      const context = renderer.getContext();

      const { keySig, isStandard } = getVexKeySig();

      const trebleStave = new Stave(10, 10, width - 20);
      trebleStave.addClef('treble');
      if (isStandard && keySig !== 'C') trebleStave.addKeySignature(keySig);
      trebleStave.setContext(context).draw();

      const bassStave = new Stave(10, 110, width - 20);
      bassStave.addClef('bass');
      if (isStandard && keySig !== 'C') bassStave.addKeySignature(keySig);
      bassStave.setContext(context).draw();

      const trebleKeys = [];
      const bassKeys = [];
      const trebleAccs = [];
      const bassAccs = [];

      puzzle.notes.forEach(n => {
        const octave = Math.floor(n.midi / 12) - 1;
        const noteAcc = getAccidentalForNote(n.letter);
        if (octave >= 4) {
          trebleKeys.push(n.vexKey);
          trebleAccs.push(!isStandard && noteAcc ? noteAcc : null);
        } else {
          bassKeys.push(n.vexKey);
          bassAccs.push(!isStandard && noteAcc ? noteAcc : null);
        }
      });

      let trebleNote;
      if (trebleKeys.length > 0) {
        trebleNote = new StaveNote({ clef: 'treble', keys: trebleKeys, duration: 'w' });
        trebleAccs.forEach((acc, idx) => {
          if (acc) trebleNote.addModifier(new Accidental(acc), idx);
        });
      } else {
        trebleNote = new StaveNote({ clef: 'treble', keys: ['b/4'], duration: 'wr' });
      }

      let bassNote;
      if (bassKeys.length > 0) {
        bassNote = new StaveNote({ clef: 'bass', keys: bassKeys, duration: 'w' });
        bassAccs.forEach((acc, idx) => {
          if (acc) bassNote.addModifier(new Accidental(acc), idx);
        });
      } else {
        bassNote = new StaveNote({ clef: 'bass', keys: ['d/3'], duration: 'wr' });
      }

      const trebleVoice = new Voice({ num_beats: 4, beat_value: 4 }).setMode(Voice.Mode.SOFT);
      trebleVoice.addTickables([trebleNote]);

      const bassVoice = new Voice({ num_beats: 4, beat_value: 4 }).setMode(Voice.Mode.SOFT);
      bassVoice.addTickables([bassNote]);

      new Formatter().joinVoices([trebleVoice]).joinVoices([bassVoice]).format([trebleVoice, bassVoice], width - 120);
      trebleVoice.draw(context, trebleStave);
      bassVoice.draw(context, bassStave);
    }

    function renderIntervalAnswerButtons() {
      const container = document.getElementById('answers');
      container.innerHTML = '';

      intervalAnswerOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = option;
        btn.dataset.type = option;
        btn.onclick = () => toggleSelection(option, btn);
        container.appendChild(btn);
      });
    }

    function toggleSelection(typeName, btn) {
      if (gameState !== SELECTING) return;

      if (selectedTypes.has(typeName)) {
        selectedTypes.delete(typeName);
        btn.classList.remove('selected');
      } else {
        selectedTypes.add(typeName);
        btn.classList.add('selected');
      }

      document.getElementById('submit-btn').disabled = selectedTypes.size === 0;
    }

    function submitAnswer() {
      if (gameState !== SELECTING || selectedTypes.size === 0) return;
      gameState = ANSWERED;
      total++;

      const validTypeNames = currentPuzzle.validTypeNames;
      const selected = [...selectedTypes];

      const allCorrectSelected = validTypeNames.every(t => selected.includes(t));
      const noWrongSelected = selected.every(t => validTypeNames.includes(t));
      const perfect = allCorrectSelected && noWrongSelected;

      if (perfect) score++;

      const buttons = document.querySelectorAll('.answer-btn');
      buttons.forEach(btn => {
        btn.disabled = true;
        const type = btn.dataset.type;
        const isValid = validTypeNames.includes(type);
        const wasSelected = selectedTypes.has(type);

        if (isValid && wasSelected) {
          btn.classList.remove('selected');
          btn.classList.add('correct');
        } else if (!isValid && wasSelected) {
          btn.classList.remove('selected');
          btn.classList.add('incorrect');
        } else if (isValid && !wasSelected) {
          btn.classList.add('missed');
        }
      });

      document.getElementById('score').textContent = score;
      document.getElementById('total').textContent = total;

      const feedbackEl = document.getElementById('feedback');
      const detailsEl = document.getElementById('feedback-details');
      const lines = currentPuzzle.validChords.map(vc => {
        return `<span class="valid-chord"><span class="chord-root">${vc.rootDisplay}</span> ${vc.typeName}</span>`;
      });
      feedbackEl.textContent = '';
      if (perfect) {
        detailsEl.innerHTML = `<span style="color:#155724">\u2713</span> ${lines.join('')}`;
      } else {
        detailsEl.innerHTML = `<span style="color:#dc3545">\u2717</span> ${lines.join('')}`;
      }

      document.getElementById('note-names').textContent = currentPuzzle.notes.map(n => n.noteName).join(' \u2013 ');

      document.getElementById('submit-btn').disabled = true;
      document.getElementById('controls').style.display = 'flex';

      updatePedalDisplay();
      updateKeySigButtons();
    }

    function newPuzzle() {
      gameState = IDLE;
      selectedTypes.clear();

      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').style.color = '#666';
      document.getElementById('feedback-details').innerHTML = '';
      document.getElementById('note-names').textContent = '';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').style.display = '';

      currentPuzzle = generatePuzzle();

      if (!currentPuzzle) {
        document.getElementById('notation').innerHTML = '<div style="padding: 2rem; text-align: center; color: #888; font-size: 0.95rem;">Could not generate a puzzle with current pedal settings. Try adjusting the key signature.</div>';
        renderIntervalAnswerButtons();
        document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
        return;
      }

      renderNotes(currentPuzzle);
      renderIntervalAnswerButtons();

      gameState = SELECTING;
      updatePedalDisplay();
      updateKeySigButtons();
    }

    function setNoteMode(mode) {
      if (gameState === SELECTING) return;
      noteMode = mode;
      document.getElementById('mode-2').className = `mode-btn${mode === 2 ? ' active' : ''}`;
      document.getElementById('mode-3').className = `mode-btn${mode === 3 ? ' active' : ''}`;
      newPuzzle();
    }

    // ══════════════════════════════════════════
    //  13. PITCH DETECTION (AMDF)
    // ══════════════════════════════════════════
    function detectPitch(buf, sr) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / buf.length);
      if (rms < NOISE_GATE) return null;

      const N = buf.length, HALF = N >> 1;
      let best = -1, bestC = 0, found = false;
      const c = new Float32Array(HALF);

      for (let off = 0; off < HALF; off++) {
        let sum = 0;
        for (let i = 0; i < HALF; i++) sum += Math.abs(buf[i] - buf[i + off]);
        c[off] = 1 - sum / HALF;
        if (c[off] > CLARITY_THRESH && !found) found = true;
        if (found) {
          if (c[off] > bestC) { bestC = c[off]; best = off; }
          else if (c[off] < bestC - 0.1) break;
        }
      }
      if (bestC < 0.8 || best < 1) return null;

      const a = c[best - 1], b = c[best], d = c[best + 1];
      const shift = (d - a) / (2 * (2 * b - d - a));
      return sr / (best + shift);
    }

    // ══════════════════════════════════════════
    //  14. SIGHT READING DRILL
    // ══════════════════════════════════════════

    // -- SR state --
    let srCanvas, srCtx, srW, srH, srCenterY;
    let srRunning = false;
    let srAnimFrameId = null;
    let srSession = null;

    // -- SR config --
    let srConfig = {
      durationSecs: 60,
      fingers: 4,
      speed: 'relaxed',   // 'relaxed' | 'moderate' | 'brisk'
      inputMode: 'manual', // 'manual' | 'mic'
    };

    // -- SR adaptive pacing constants --
    const SR_SPEEDS = { relaxed: 4.0, moderate: 2.5, brisk: 1.5 };
    const SR_STREAK_TO_SPEED_UP = 4;
    const SR_SPEED_UP_FACTOR = 0.90;
    const SR_SLOW_DOWN_FACTOR = 1.15;
    const SR_MIN_SECS = 0.4;
    const SR_MAX_SECS = 8.0;
    const SR_ACCURACY_GATE = 90;
    const SR_RANGE_EXPAND_INTERVAL = 8;
    const SR_CANVAS_HEIGHT = 400;

    // -- SR helpers --
    function srAvailableNotes(lowMidi, highMidi) {
      const pcs = new Set();
      for (const letter of noteLetters) {
        pcs.add(getNoteSemitone(letter));
      }
      const notes = [];
      for (let m = lowMidi; m <= highMidi; m++) {
        if (pcs.has(m % 12)) notes.push(m);
      }
      return notes;
    }

    function srGeneratePosition(available, fingers, weakNotes, lastPosition) {
      if (available.length < 2) return { notes: available.slice(0, fingers) };

      // Find valid starting indices for consecutive runs
      const starts = [];
      for (let i = 0; i <= available.length - fingers; i++) {
        // Check hand span (max 10 semitones)
        if (available[i + fingers - 1] - available[i] <= 10) {
          starts.push(i);
        }
      }
      if (starts.length === 0) {
        // Fallback: just pick any consecutive notes
        for (let i = 0; i <= available.length - fingers; i++) {
          starts.push(i);
        }
      }
      if (starts.length === 0) {
        return { notes: available.slice(0, fingers) };
      }

      // Weight toward positions containing weak notes
      const weakSet = new Set(weakNotes || []);
      const weights = starts.map(si => {
        let w = 1;
        for (let f = 0; f < fingers; f++) {
          if (weakSet.has(available[si + f])) w += 3;
        }
        // Penalize same as last position
        if (lastPosition) {
          const same = lastPosition.notes.every((n, idx) => available[si + idx] === n);
          if (same) w *= 0.1;
        }
        return w;
      });

      const totalW = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * totalW;
      let chosen = starts[0];
      for (let i = 0; i < starts.length; i++) {
        r -= weights[i];
        if (r <= 0) { chosen = starts[i]; break; }
      }

      const notes = [];
      for (let f = 0; f < fingers; f++) {
        notes.push(available[chosen + f]);
      }
      return { notes };
    }

    function srCreateSession() {
      const targetSecs = SR_SPEEDS[srConfig.speed];
      const lowMidi = 48;  // C3
      const highMidi = 79; // G5

      // Start with narrow range (~1 octave) centered
      const mid = Math.floor((lowMidi + highMidi) / 2);
      const halfSpan = 7;
      const effectiveLow = Math.max(mid - halfSpan, lowMidi);
      const effectiveHigh = Math.min(mid + halfSpan, highMidi);

      const available = srAvailableNotes(effectiveLow, effectiveHigh);
      const fingers = Math.min(srConfig.fingers, available.length || 1);

      const position = srGeneratePosition(available, fingers, [], null);

      return {
        durationSecs: srConfig.durationSecs,
        fingers: srConfig.fingers,
        inputMode: srConfig.inputMode,
        lowMidi, highMidi,
        effectiveLow, effectiveHigh,
        available,
        position,
        fingerIndex: 0,
        positionsCompleted: 0,
        hits: 0,
        misses: 0,
        startTime: performance.now(),
        noteStartTime: performance.now(),
        finished: false,
        targetSecs,
        streak: 0,
        level: 0,
        lastWasLate: false,
        noteTimes: {},  // midi -> [responseSecs]
      };
    }

    function srWeakestNotes(session, n) {
      const avgs = [];
      for (const [midi, times] of Object.entries(session.noteTimes)) {
        if (times.length > 0) {
          const avg = times.reduce((a, b) => a + b, 0) / times.length;
          avgs.push({ midi: parseInt(midi), avg });
        }
      }
      avgs.sort((a, b) => b.avg - a.avg);
      return avgs.slice(0, n).map(x => x.midi);
    }

    function srMaybeExpandRange(s) {
      if (s.positionsCompleted % SR_RANGE_EXPAND_INTERVAL !== 0 || s.positionsCompleted === 0) return;

      const pcs = new Set();
      for (const letter of noteLetters) pcs.add(getNoteSemitone(letter));

      // Expand one note lower
      if (s.effectiveLow > s.lowMidi) {
        for (let m = s.effectiveLow - 1; m >= s.lowMidi; m--) {
          if (pcs.has(m % 12)) { s.effectiveLow = m; break; }
        }
      }
      // Expand one note higher
      if (s.effectiveHigh < s.highMidi) {
        for (let m = s.effectiveHigh + 1; m <= s.highMidi; m++) {
          if (pcs.has(m % 12)) { s.effectiveHigh = m; break; }
        }
      }
      s.available = srAvailableNotes(s.effectiveLow, s.effectiveHigh);
    }

    function srNextPosition(s) {
      const weak = srWeakestNotes(s, 3);
      const fingers = Math.min(s.fingers, s.available.length || 1);
      s.position = srGeneratePosition(s.available, fingers, weak, s.position);
      s.fingerIndex = 0;
    }

    function srAccuracy(s) {
      const total = s.hits + s.misses;
      return total === 0 ? 100 : (s.hits / total * 100);
    }

    function srAdvanceNote(s) {
      const now = performance.now();
      const elapsed = (now - s.noteStartTime) / 1000;
      const onPace = elapsed <= s.targetSecs * 1.1;

      // Record response time
      const midi = s.position.notes[s.fingerIndex];
      if (midi !== undefined) {
        if (!s.noteTimes[midi]) s.noteTimes[midi] = [];
        s.noteTimes[midi].push(elapsed);
      }

      s.hits++;
      s.fingerIndex++;
      s.lastWasLate = !onPace;

      // Adaptive pacing
      if (onPace && srAccuracy(s) >= SR_ACCURACY_GATE) {
        s.streak++;
        if (s.streak >= SR_STREAK_TO_SPEED_UP) {
          s.targetSecs = Math.max(s.targetSecs * SR_SPEED_UP_FACTOR, SR_MIN_SECS);
          s.streak = 0;
          s.level++;
        }
      } else if (!onPace) {
        s.targetSecs = Math.min(s.targetSecs * SR_SLOW_DOWN_FACTOR, SR_MAX_SECS);
        s.streak = 0;
      }

      s.noteStartTime = performance.now();

      // Next position?
      if (s.fingerIndex >= s.position.notes.length) {
        s.positionsCompleted++;
        srMaybeExpandRange(s);
        srNextPosition(s);
      }

      srCheckTime(s);
    }

    function srAutoAdvance(s) {
      if (s.finished) return false;
      const elapsed = (performance.now() - s.noteStartTime) / 1000;
      if (elapsed >= s.targetSecs) {
        if (s.inputMode === 'mic') s.misses++;
        s.lastWasLate = true;
        s.streak = 0;
        s.targetSecs = Math.min(s.targetSecs * SR_SLOW_DOWN_FACTOR, SR_MAX_SECS);
        s.fingerIndex++;
        s.noteStartTime = performance.now();

        if (s.fingerIndex >= s.position.notes.length) {
          s.positionsCompleted++;
          srMaybeExpandRange(s);
          srNextPosition(s);
        }
        srCheckTime(s);
        return true;
      }
      return false;
    }

    function srCheckNote(s, detectedMidi) {
      if (s.finished) return 'waiting';
      const target = s.position.notes[s.fingerIndex];
      if (target === undefined) return 'waiting';

      if (detectedMidi === target) {
        srAdvanceNote(s);
        return 'hit';
      } else {
        s.misses++;
        s.targetSecs = Math.min(s.targetSecs * SR_SLOW_DOWN_FACTOR, SR_MAX_SECS);
        s.streak = 0;
        return 'miss';
      }
    }

    function srCheckTime(s) {
      const elapsed = (performance.now() - s.startTime) / 1000;
      if (elapsed >= s.durationSecs) s.finished = true;
    }

    function srTimeRemaining(s) {
      return Math.max(0, s.durationSecs - (performance.now() - s.startTime) / 1000);
    }

    function srNotesPerMinute(s) {
      const elapsed = (performance.now() - s.startTime) / 1000;
      if (elapsed < 0.1) return 0;
      return s.hits / (elapsed / 60);
    }

    // -- SR canvas --
    function initSrCanvas() {
      srCanvas = document.getElementById('sr-canvas');
      srCtx = srCanvas.getContext('2d');
      resizeSrCanvas();
    }

    function resizeSrCanvas() {
      if (!srCanvas) return;
      const dpr = window.devicePixelRatio || 1;
      const container = document.getElementById('staff-container');
      srW = container.clientWidth;
      srH = SR_CANVAS_HEIGHT;
      srCanvas.width = srW * dpr;
      srCanvas.height = srH * dpr;
      srCanvas.style.width = srW + 'px';
      srCanvas.style.height = srH + 'px';
      srCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      srCenterY = srH / 2;
    }

    function srPosToY(pos) {
      return srCenterY - (pos - 28) * STEP;
    }

    function srDrawStaffLines() {
      srCtx.strokeStyle = '#b0aba0';
      srCtx.lineWidth = 1;
      const left = 10;
      const right = srW - 10;
      srCtx.beginPath();
      for (const p of TREBLE_LINES) {
        const y = srPosToY(p);
        srCtx.moveTo(left, y); srCtx.lineTo(right, y);
      }
      for (const p of BASS_LINES) {
        const y = srPosToY(p);
        srCtx.moveTo(left, y); srCtx.lineTo(right, y);
      }
      srCtx.stroke();

      // Clef labels
      srCtx.fillStyle = '#999';
      srCtx.font = '600 13px "Crimson Pro", serif';
      srCtx.textAlign = 'right';
      srCtx.textBaseline = 'middle';
      srCtx.fillText('\uD834\uDD1E', left - 2, srPosToY(34));
      srCtx.fillText('\uD834\uDD22', left - 2, srPosToY(22));
    }

    function srDrawLedgerLines(x, pos) {
      srCtx.strokeStyle = '#b0aba0';
      srCtx.lineWidth = 1;
      const hw = NOTE_RX + 4;
      const lines = [];
      for (let p = 40; p <= pos; p += 2) lines.push(p);
      for (let p = 16; p >= pos; p -= 2) lines.push(p);
      if (pos === 28) lines.push(28);
      if (pos > 26 && pos < 30 && pos % 2 === 0) lines.push(pos);

      if (lines.length > 0) {
        srCtx.beginPath();
        for (const lp of lines) {
          const ly = srPosToY(lp);
          srCtx.moveTo(x - hw, ly); srCtx.lineTo(x + hw, ly);
        }
        srCtx.stroke();
      }
    }

    function srDrawHandPosition(s) {
      if (!s || !s.position || s.position.notes.length === 0) return;

      const notes = s.position.notes;
      const keyRoot = getKeyRootFromPedals();
      const spacing = NOTE_RX * 3.5;
      const totalWidth = (notes.length - 1) * spacing;
      const centerX = srW / 2;
      const startX = centerX - totalWidth / 2;

      for (let i = 0; i < notes.length; i++) {
        const midi = notes[i];
        const x = startX + i * spacing;
        const pos = midiToStaffPos(midi);
        const y = srPosToY(pos);
        const degree = getScaleDegree(midi, keyRoot);

        let color, alpha;
        if (i === s.fingerIndex) {
          color = '#2563eb'; alpha = 1.0;
        } else if (i < s.fingerIndex) {
          color = '#28a745'; alpha = 0.35;
        } else {
          color = '#5a5a5a'; alpha = 0.4;
        }

        srCtx.globalAlpha = alpha;

        // Ledger lines
        srDrawLedgerLines(x, pos);

        // Sharp indicator
        if (IS_SHARP[midi % 12]) {
          srCtx.fillStyle = color;
          srCtx.font = '14px "Crimson Pro", serif';
          srCtx.textAlign = 'right';
          srCtx.textBaseline = 'middle';
          srCtx.fillText('\u266f', x - NOTE_RX - 4, y);
        }

        // Shaped notehead
        srCtx.fillStyle = color;
        srCtx.beginPath();
        shapePath(srCtx, x, y, NOTE_RX, NOTE_RY, degree);
        srCtx.fill();

        // Finger number
        const fingerNum = i + 1;
        const labelY = pos < 28 ? y + NOTE_RY + 12 : y - NOTE_RY - 12;
        const labelAlpha = i === s.fingerIndex ? 0.9 : 0.3;
        srCtx.globalAlpha = labelAlpha;
        srCtx.fillStyle = '#5a5a5a';
        srCtx.font = '10px "JetBrains Mono", monospace';
        srCtx.textAlign = 'center';
        srCtx.textBaseline = 'middle';
        srCtx.fillText(String(fingerNum), x, labelY);
      }

      srCtx.globalAlpha = 1;
    }

    function srDrawHUD(s) {
      if (!s) return;

      const remaining = srTimeRemaining(s);
      const mins = Math.floor(remaining / 60);
      const secs = Math.floor(remaining % 60);
      const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      // Time remaining - top left
      srCtx.fillStyle = '#888';
      srCtx.font = '600 14px "JetBrains Mono", monospace';
      srCtx.textAlign = 'left';
      srCtx.textBaseline = 'top';
      srCtx.fillText(timeStr, 12, 12);

      // Positions completed
      srCtx.fillStyle = '#aaa';
      srCtx.font = '11px "JetBrains Mono", monospace';
      srCtx.fillText(`Pos: ${s.positionsCompleted}`, 12, 30);

      // NPM - top right
      const npm = srNotesPerMinute(s);
      srCtx.fillStyle = '#2563eb';
      srCtx.font = '600 14px "JetBrains Mono", monospace';
      srCtx.textAlign = 'right';
      srCtx.fillText(`${npm.toFixed(0)} NPM`, srW - 12, 12);

      // Accuracy
      if (s.inputMode === 'mic') {
        srCtx.fillStyle = '#aaa';
        srCtx.font = '11px "JetBrains Mono", monospace';
        srCtx.fillText(`${srAccuracy(s).toFixed(0)}%`, srW - 12, 30);
      }

      // Timing bar at bottom
      const fraction = Math.min((performance.now() - s.noteStartTime) / 1000 / s.targetSecs, 1.5);
      const barY = srH - 8;
      const barW = srW - 24;
      const barH = 4;

      srCtx.fillStyle = '#eee';
      srCtx.fillRect(12, barY, barW, barH);

      const fillW = Math.min(fraction, 1.0) * barW;
      const barColor = fraction > 1.0 ? '#dc3545' : fraction > 0.8 ? '#e6a800' : '#28a745';
      srCtx.fillStyle = barColor;
      srCtx.fillRect(12, barY, fillW, barH);

      // Streak dots
      const dotY = barY - 10;
      for (let i = 0; i < SR_STREAK_TO_SPEED_UP; i++) {
        const dx = 12 + i * 10;
        srCtx.beginPath();
        srCtx.arc(dx + 3, dotY, 3, 0, Math.PI * 2);
        srCtx.fillStyle = i < s.streak ? '#2563eb' : '#ddd';
        srCtx.fill();
      }

      // Level
      if (s.level > 0) {
        srCtx.fillStyle = '#2563eb';
        srCtx.font = '10px "JetBrains Mono", monospace';
        srCtx.textAlign = 'left';
        srCtx.fillText(`Lv ${s.level}`, 12 + SR_STREAK_TO_SPEED_UP * 10 + 8, dotY);
      }

      // Input hint
      if (s.inputMode === 'manual') {
        srCtx.fillStyle = '#ccc';
        srCtx.font = '11px "Crimson Pro", serif';
        srCtx.textAlign = 'center';
        srCtx.textBaseline = 'bottom';
        srCtx.fillText('Press Space to advance', srW / 2, srH - 18);
      }
    }

    function srDrawLegend() {
      const keyRoot = getKeyRootFromPedals();
      const y = srPosToY(44) - 10;
      const startX = 20;
      srCtx.font = '10px "JetBrains Mono", monospace';
      srCtx.textAlign = 'left';
      srCtx.textBaseline = 'middle';

      for (let d = 1; d <= 7; d++) {
        const ox = startX + (d - 1) * 52;
        srCtx.fillStyle = '#3a3a3a';
        srCtx.beginPath();
        shapePath(srCtx, ox + 7, y, 6, 5, d);
        srCtx.fill();
        srCtx.fillStyle = '#999';
        srCtx.fillText(SOLFEGE[d - 1], ox + 16, y);
      }
    }

    function srFrame() {
      if (!srRunning || !srSession) return;

      const s = srSession;

      // Auto-advance at the beat
      srAutoAdvance(s);

      // Mic input
      if (s.inputMode === 'mic' && analyser && dataArray) {
        analyser.getFloatTimeDomainData(dataArray);
        if (wasmDetector) {
          const pcs = new Uint8Array(noteLetters.map(l => getNoteSemitone(l)));
          const midis = wasmDetector.detect_notes(dataArray, pcs, 48, 79);
          for (const midi of midis) {
            srCheckNote(s, midi);
          }
        } else {
          const freq = detectPitch(dataArray, audioCtx.sampleRate);
          if (freq) {
            const midi = freqToMidi(freq);
            if (midi >= 12 && midi <= 108) {
              srCheckNote(s, midi);
            }
          }
        }
      }

      // Check finished
      srCheckTime(s);
      if (s.finished) {
        srRunning = false;
        showSrResults();
        return;
      }

      // Clear
      srCtx.fillStyle = '#f8f6f1';
      srCtx.fillRect(0, 0, srW, srH);

      // Draw
      srDrawStaffLines();
      srDrawLegend();
      srDrawHandPosition(s);
      srDrawHUD(s);

      srAnimFrameId = requestAnimationFrame(srFrame);
    }

    // -- SR setup button helpers --
    function srSetDuration(secs) {
      srConfig.durationSecs = secs;
      const labels = {60:'1 min',120:'2 min',300:'5 min'};
      const btns = document.querySelectorAll('#sr-duration-row .mode-btn');
      btns.forEach(b => b.className = 'mode-btn' + (b.textContent.trim() === labels[secs] ? ' active' : ''));
    }

    function srSetFingers(n) {
      srConfig.fingers = n;
      const btns = document.querySelectorAll('#sr-fingers-row .mode-btn');
      btns.forEach(b => b.className = 'mode-btn' + (b.textContent.trim() === String(n) ? ' active' : ''));
    }

    function srSetSpeed(speed) {
      srConfig.speed = speed;
      const labels = { relaxed: 'Relaxed', moderate: 'Moderate', brisk: 'Brisk' };
      const btns = document.querySelectorAll('#sr-speed-row .mode-btn');
      btns.forEach(b => b.className = 'mode-btn' + (b.textContent.trim() === labels[speed] ? ' active' : ''));
    }

    function srSetInput(mode) {
      srConfig.inputMode = mode;
      const btns = document.querySelectorAll('#sr-input-row .mode-btn');
      btns.forEach((b, i) => b.className = 'mode-btn' + ((i === 0 && mode === 'manual') || (i === 1 && mode === 'mic') ? ' active' : ''));
    }

    // -- SR lifecycle --
    async function startSightRead() {
      document.getElementById('sr-setup-overlay').style.display = 'none';
      document.getElementById('sr-results-overlay').style.display = 'none';

      resizeSrCanvas();
      srSession = srCreateSession();

      // Start mic if mic mode
      if (srConfig.inputMode === 'mic' && !audioCtx) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioCtx = new AudioContext();
          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = FFT_SIZE;
          source.connect(analyser);
          dataArray = new Float32Array(analyser.fftSize);
        } catch (e) {
          // Fall back to manual mode
          srConfig.inputMode = 'manual';
          srSession.inputMode = 'manual';
        }
      }

      srRunning = true;
      srFrame();
    }

    function stopSightRead() {
      srRunning = false;
      if (srAnimFrameId) {
        cancelAnimationFrame(srAnimFrameId);
        srAnimFrameId = null;
      }
      srSession = null;
    }

    function showSrResults() {
      if (!srSession) return;
      const s = srSession;
      const npm = srNotesPerMinute(s);

      document.getElementById('sr-result-npm').textContent = npm.toFixed(0);
      document.getElementById('sr-result-positions').textContent = `${s.positionsCompleted} positions completed \u00b7 ${s.hits} notes hit`;

      if (s.inputMode === 'mic') {
        document.getElementById('sr-result-accuracy').textContent = `Accuracy: ${srAccuracy(s).toFixed(0)}%`;
      } else {
        document.getElementById('sr-result-accuracy').textContent = '';
      }

      const finalBPM = (60 / s.targetSecs).toFixed(0);
      const startBPM = (60 / SR_SPEEDS[srConfig.speed]).toFixed(0);
      document.getElementById('sr-result-pace').textContent = `Pace: ${startBPM} \u2192 ${finalBPM} BPM`;

      const lowName = ['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'][s.effectiveLow % 12];
      const lowOct = Math.floor(s.effectiveLow / 12) - 1;
      const highName = ['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'][s.effectiveHigh % 12];
      const highOct = Math.floor(s.effectiveHigh / 12) - 1;
      document.getElementById('sr-result-range').textContent = `Range: ${lowName}${lowOct}\u2013${highName}${highOct}`;

      if (s.level > 0) {
        document.getElementById('sr-result-level').textContent = `\u2B06 ${s.level} level-up${s.level > 1 ? 's' : ''}!`;
      } else {
        document.getElementById('sr-result-level').textContent = '';
      }

      document.getElementById('sr-results-overlay').style.display = 'flex';
    }

    function showSrSetup() {
      stopSightRead();
      document.getElementById('sr-results-overlay').style.display = 'none';
      document.getElementById('sr-setup-overlay').style.display = 'flex';
    }

    // -- SR keyboard handler --
    document.addEventListener('keydown', (e) => {
      if (appMode !== 'sightread' || !srRunning || !srSession) return;
      if (e.code === 'Space' && srSession.inputMode === 'manual') {
        e.preventDefault();
        if (!srSession.finished) {
          srAdvanceNote(srSession);
          if (srSession.finished) {
            srRunning = false;
            showSrResults();
          }
        }
      }
    });

    // ══════════════════════════════════════════
    //  15. INIT
    // ══════════════════════════════════════════
    window.addEventListener('resize', () => {
      if (appMode === 'sightread' && srCanvas) {
        resizeSrCanvas();
      }
    });

    updateKeyLabel();
    setAppMode('chordId');
  </script>
</body>
</html>
