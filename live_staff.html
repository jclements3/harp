<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harp Live Staff</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=JetBrains+Mono:wght@400&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8f6f1;
      overflow: hidden;
      font-family: 'Crimson Pro', Georgia, serif;
    }
    canvas { display: block; }
    #start-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem;
      background: rgba(248,246,241,0.97);
      z-index: 10;
    }
    #start-overlay h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #4a4a4a;
    }
    #start-overlay p {
      font-size: 0.95rem;
      color: #888;
    }
    #start-btn {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.15rem;
      padding: 0.9rem 2.5rem;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #1d4ed8; }
    #start-btn:active { transform: scale(0.97); }
    #start-btn:disabled { background: #a0a0a0; cursor: default; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="start-overlay">
    <h1>HARP LIVE STAFF</h1>
    <p>Real-time pitch detection on a scrolling grand staff</p>
    <button id="start-btn" onclick="start()">Start Listening</button>
    <button id="demo-btn" onclick="startDemo()" style="font-family:'Crimson Pro',Georgia,serif;font-size:1rem;padding:0.7rem 2rem;border:2px solid #ccc;border-radius:10px;background:white;color:#555;cursor:pointer;transition:all 0.15s">Demo (no mic)</button>
  </div>

  <script>
    // ─── CONFIG ───
    const FFT_SIZE = 4096;
    const SCROLL_PX_SEC = 90;
    const NOISE_GATE = 0.008;
    const CLARITY_THRESH = 0.93;
    const STEP = 9;
    const LINE_SPACING = STEP * 2;
    const NOTE_RX = STEP * 1.1;
    const NOTE_RY = STEP * 0.85;
    const MARGIN_LEFT = 50;
    const MARGIN_RIGHT = 110;
    const GAP_MS = 150;

    // ─── MUSIC CONSTANTS ───
    const DIATONIC = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];
    const IS_SHARP =
      [false, true, false, true, false, false, true, false, true, false, true, false];
    const NOTE_NAMES =
      ['C','\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];

    // Staff line positions (diatonic):
    //   Treble: E4=30  G4=32  B4=34  D5=36  F5=38
    //   Bass:   G2=18  B2=20  D3=22  F3=24  A3=26
    //   Middle C = C4 = 28
    const TREBLE_LINES = [30, 32, 34, 36, 38];
    const BASS_LINES   = [18, 20, 22, 24, 26];

    // ─── STATE ───
    let audioCtx, analyser, dataArray;
    let running = false;
    let noteBuffer = [];
    let currentNote = null;

    // ─── LAYOUT (set on resize) ───
    let canvas, ctx, W, H, centerY, nowX;

    // ─── HELPERS ───
    function midiToStaffPos(midi) {
      return (Math.floor(midi / 12) - 1) * 7 + DIATONIC[midi % 12];
    }

    function posToY(pos) {
      return centerY - (pos - 28) * STEP;
    }

    function freqToMidi(freq) {
      return Math.round(69 + 12 * Math.log2(freq / 440));
    }

    function freqToCents(freq, midi) {
      const exact = 440 * Math.pow(2, (midi - 69) / 12);
      return 1200 * Math.log2(freq / exact);
    }

    function noteName(midi) {
      const idx = midi % 12;
      const oct = Math.floor(midi / 12) - 1;
      return NOTE_NAMES[idx] + oct;
    }

    // ─── PITCH DETECTION (normalised AMDF) ───
    function detectPitch(buf, sr) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / buf.length);
      if (rms < NOISE_GATE) return null;

      const N = buf.length, HALF = N >> 1;
      let best = -1, bestC = 0, found = false;
      const c = new Float32Array(HALF);

      for (let off = 0; off < HALF; off++) {
        let sum = 0;
        for (let i = 0; i < HALF; i++) sum += Math.abs(buf[i] - buf[i + off]);
        c[off] = 1 - sum / HALF;
        if (c[off] > CLARITY_THRESH && !found) found = true;
        if (found) {
          if (c[off] > bestC) { bestC = c[off]; best = off; }
          else if (c[off] < bestC - 0.1) break;
        }
      }
      if (bestC < 0.8 || best < 1) return null;

      const a = c[best - 1], b = c[best], d = c[best + 1];
      const shift = (d - a) / (2 * (2 * b - d - a));
      return sr / (best + shift);
    }

    // ─── RENDERING ───
    function drawStaff() {
      ctx.strokeStyle = '#b0aba0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const p of TREBLE_LINES) {
        const y = posToY(p);
        ctx.moveTo(MARGIN_LEFT, y); ctx.lineTo(nowX + 15, y);
      }
      for (const p of BASS_LINES) {
        const y = posToY(p);
        ctx.moveTo(MARGIN_LEFT, y); ctx.lineTo(nowX + 15, y);
      }
      ctx.stroke();

      // Clef labels
      ctx.fillStyle = '#999';
      ctx.font = '600 13px "Crimson Pro", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Treble', MARGIN_LEFT / 2, posToY(34));
      ctx.fillText('Bass',   MARGIN_LEFT / 2, posToY(22));
    }

    function drawTimeGrid(now) {
      ctx.strokeStyle = 'rgba(0,0,0,0.05)';
      ctx.lineWidth = 1;
      const px = SCROLL_PX_SEC;
      const off = (now / 1000) % 1 * px;
      const top = posToY(42), bot = posToY(14);
      ctx.beginPath();
      for (let x = nowX - off; x > MARGIN_LEFT; x -= px) {
        ctx.moveTo(x, top); ctx.lineTo(x, bot);
      }
      ctx.stroke();
    }

    function drawNowLine() {
      ctx.strokeStyle = 'rgba(37,99,235,0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(nowX, posToY(44));
      ctx.lineTo(nowX, posToY(12));
      ctx.stroke();
    }

    function getLedgerLines(pos) {
      const lines = [];
      for (let p = 40; p <= pos; p += 2) lines.push(p);
      for (let p = 16; p >= pos; p -= 2) lines.push(p);
      if (pos === 28) lines.push(28);
      return lines;
    }

    function buildSegments(now) {
      const windowMs = (nowX - MARGIN_LEFT) / SCROLL_PX_SEC * 1000 + 500;
      const cutoff = now - windowMs;
      while (noteBuffer.length > 0 && noteBuffer[0].time < cutoff) noteBuffer.shift();

      const segs = [];
      if (noteBuffer.length === 0) return segs;

      let sStart = 0;
      for (let i = 1; i <= noteBuffer.length; i++) {
        const split = i === noteBuffer.length
          || noteBuffer[i].midi !== noteBuffer[i - 1].midi
          || noteBuffer[i].time - noteBuffer[i - 1].time > GAP_MS;
        if (split) {
          segs.push({
            midi: noteBuffer[sStart].midi,
            t0: noteBuffer[sStart].time,
            t1: noteBuffer[i - 1].time,
          });
          sStart = i;
        }
      }
      return segs;
    }

    function drawSegments(now, segs) {
      for (const seg of segs) {
        const x1 = nowX - ((now - seg.t1) / 1000) * SCROLL_PX_SEC;
        const x0 = nowX - ((now - seg.t0) / 1000) * SCROLL_PX_SEC;
        if (x0 < MARGIN_LEFT - 20 || x1 > nowX + 20) continue;

        const cx0 = Math.max(x0, MARGIN_LEFT - 10);
        const cx1 = Math.min(x1, nowX + 10);
        const pos = midiToStaffPos(seg.midi);
        const y = posToY(pos);

        // Fade near left edge
        const fade = cx0 < MARGIN_LEFT + 40
          ? Math.max(0.1, (cx0 - MARGIN_LEFT + 10) / 50) : 1;
        const isRecent = seg.t1 > now - 120;

        // Ledger lines
        const ledgers = getLedgerLines(pos);
        if (ledgers.length > 0) {
          ctx.globalAlpha = fade * 0.7;
          ctx.strokeStyle = '#b0aba0';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (const lp of ledgers) {
            const ly = posToY(lp);
            ctx.moveTo(cx0 - 4, ly); ctx.lineTo(cx1 + 4, ly);
          }
          ctx.stroke();
        }

        // Note bar
        ctx.globalAlpha = fade;
        ctx.fillStyle = isRecent ? '#2563eb' : '#3a3a3a';
        const w = cx1 - cx0;
        const h = NOTE_RY * 2;
        if (w < NOTE_RX * 2) {
          ctx.beginPath();
          ctx.ellipse((cx0 + cx1) / 2, y, NOTE_RX, NOTE_RY, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.roundRect(cx0, y - NOTE_RY, w, h, NOTE_RY);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    function drawCurrentInfo() {
      if (!currentNote) {
        ctx.fillStyle = '#ccc';
        ctx.font = '18px "Crimson Pro", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Play a note\u2026', nowX + MARGIN_RIGHT / 2, centerY);
        return;
      }

      const x = nowX + MARGIN_RIGHT / 2;

      // Note name
      ctx.fillStyle = '#2563eb';
      ctx.font = 'bold 32px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(currentNote.name, x, centerY - 8);

      // Frequency
      ctx.fillStyle = '#999';
      ctx.font = '12px "JetBrains Mono", monospace';
      ctx.textBaseline = 'top';
      ctx.fillText(currentNote.freq.toFixed(1) + ' Hz', x, centerY + 4);

      // Cents
      const cents = freqToCents(currentNote.freq, currentNote.midi);
      const ct = cents >= 0 ? '+' + cents.toFixed(0) + '\u00a2' : cents.toFixed(0) + '\u00a2';
      ctx.fillStyle = Math.abs(cents) < 10 ? '#28a745'
        : Math.abs(cents) < 25 ? '#e6a800' : '#dc3545';
      ctx.fillText(ct, x, centerY + 22);
    }

    // ─── DEMO MODE ───
    let demoMode = false;
    let demoStartTime = 0;
    // C major arpeggio up, G7 chord, resolve to C — covers both staves + ledger lines
    const DEMO_NOTES = [
      // C major arpeggio ascending
      { midi: 48, start: 0,    dur: 400 },  // C3
      { midi: 52, start: 500,  dur: 400 },  // E3
      { midi: 55, start: 1000, dur: 400 },  // G3
      { midi: 60, start: 1500, dur: 400 },  // C4 (middle C, ledger line)
      { midi: 64, start: 2000, dur: 400 },  // E4
      { midi: 67, start: 2500, dur: 400 },  // G4
      { midi: 72, start: 3000, dur: 400 },  // C5
      { midi: 76, start: 3500, dur: 400 },  // E5
      { midi: 79, start: 4000, dur: 600 },  // G5 (ledger line above)
      // G7 chord
      { midi: 55, start: 5000, dur: 300 },  // G3
      { midi: 59, start: 5400, dur: 300 },  // B3
      { midi: 62, start: 5800, dur: 300 },  // D4
      { midi: 65, start: 6200, dur: 300 },  // F4
      // Resolve to C major
      { midi: 48, start: 7000, dur: 800 },  // C3
      { midi: 60, start: 7000, dur: 800 },  // C4
      { midi: 64, start: 7000, dur: 800 },  // E4
      { midi: 67, start: 7000, dur: 800 },  // G4
      { midi: 72, start: 7000, dur: 800 },  // C5
    ];
    const DEMO_LOOP_MS = 9000;

    function getDemoNote(now) {
      const elapsed = (now - demoStartTime) % DEMO_LOOP_MS;
      let active = null;
      for (const dn of DEMO_NOTES) {
        if (elapsed >= dn.start && elapsed < dn.start + dn.dur) {
          active = dn; // last match wins (for simultaneous notes, each gets its own frame tick)
        }
      }
      return active;
    }

    // ─── MAIN LOOP ───
    function frame() {
      if (!running) return;
      const now = performance.now();

      if (demoMode) {
        // Feed demo notes into the buffer
        const elapsed = (now - demoStartTime) % DEMO_LOOP_MS;
        for (const dn of DEMO_NOTES) {
          if (elapsed >= dn.start && elapsed < dn.start + dn.dur) {
            const freq = 440 * Math.pow(2, (dn.midi - 69) / 12);
            const jitter = (Math.random() - 0.5) * 2;
            const f = freq * Math.pow(2, jitter / 1200);
            currentNote = { midi: dn.midi, freq: f, name: noteName(dn.midi) };
            noteBuffer.push({ time: now, midi: dn.midi, freq: f });
          }
        }
        if (!DEMO_NOTES.some(dn => {
          const e = (now - demoStartTime) % DEMO_LOOP_MS;
          return e >= dn.start && e < dn.start + dn.dur;
        })) {
          currentNote = null;
        }
      } else {
        // Live mic detection
        analyser.getFloatTimeDomainData(dataArray);
        const freq = detectPitch(dataArray, audioCtx.sampleRate);
        if (freq) {
          const midi = freqToMidi(freq);
          if (midi >= 12 && midi <= 108) {
            currentNote = { midi, freq, name: noteName(midi) };
            noteBuffer.push({ time: now, midi, freq });
          }
        } else {
          currentNote = null;
        }
      }

      // Clear
      ctx.fillStyle = '#f8f6f1';
      ctx.fillRect(0, 0, W, H);

      // Draw
      drawTimeGrid(now);
      drawStaff();
      drawNowLine();
      drawSegments(now, buildSegments(now));
      drawCurrentInfo();

      requestAnimationFrame(frame);
    }

    // ─── SETUP ───
    function resize() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      centerY = H / 2;
      nowX = W - MARGIN_RIGHT;
    }

    async function start() {
      const btn = document.getElementById('start-btn');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        source.connect(analyser);
        dataArray = new Float32Array(analyser.fftSize);

        document.getElementById('start-overlay').style.display = 'none';
        running = true;
        resize();
        frame();
      } catch (e) {
        btn.textContent = 'Mic access denied';
        btn.disabled = true;
      }
    }

    function startDemo() {
      document.getElementById('start-overlay').style.display = 'none';
      demoMode = true;
      demoStartTime = performance.now();
      running = true;
      resize();
      frame();
    }

    window.addEventListener('resize', () => { resize(); });
    resize();
  </script>
</body>
</html>
