  <line x1="0" y1="28" x2="100" y2="28" stroke="#8B6914" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="41" x2="100" y2="41" stroke="#8B6914" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="54" x2="100" y2="54" stroke="#8B6914" stroke-width="2" opacity="0.4"/>
