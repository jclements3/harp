[package]
name = "harp-player"
version = "0.1.0"
edition = "2024"

[lib]
name = "harp_player"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "harp-player"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
cpal = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
winit = { version = "0.30", features = ["android-native-activity"] }

[features]
default = []
android = ["eframe/android-native-activity"]
